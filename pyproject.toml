[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosqlmigrate"
version = "0.1.0"
description = "Propose and justify NoSQL schema designs (MongoDB, Cassandra, Neo4j) from a relational schema and query workload"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # AST shapes change across sqlglot releases; pinned on purpose (see docs/phase-1-plan.md)
    "sqlglot==30.18.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
nosqlmigrate = "nosqlmigrate.cli:main"

[tool.setuptools.packages.find]
include = ["nosqlmigrate*"]

[tool.setuptools.package-data]
nosqlmigrate = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
